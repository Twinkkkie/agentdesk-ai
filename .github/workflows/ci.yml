name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentdesk
          POSTGRES_USER: agentdesk
          POSTGRES_PASSWORD: agentdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentdesk -d agentdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://agentdesk:agentdesk@localhost:5432/agentdesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: alembic upgrade head
      - run: ruff check .
      - run: pytest -q
